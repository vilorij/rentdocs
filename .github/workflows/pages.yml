name: Build and publish the docs

on:
  push:
    branches: [master]
  # So a broken build is caught on the pull request, not after merge.
  pull_request:
    branches: [master]
  workflow_dispatch:

# One in-flight deploy at a time; a newer push wins rather than queueing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `lastUpdated` reads each page's git history, so a shallow clone
          # would date every page to the deploy commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages serves this under /rentdocs/, not a domain root. Without the
      # matching base every asset URL is wrong and the site loads unstyled.
      - run: npm run build
        env:
          DOCS_BASE: /rentdocs/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
